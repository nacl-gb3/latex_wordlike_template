modifyLineBreaks:
  textWrapOptions:
    columns: 80
    multipleSpacesToSingle: 1
    removeBlockLineBreaks: 1
    when: before                         # before/after
    comments:
      wrap: 0                           # 0/1
      inheritLeadingSpace: 0            # 0/1
    blocksFollow:
      headings: 1                       # 0/1
      commentOnPreviousLine: 1          # 0/1
      par: 1                            # 0/1
      blankLine: 1                      # 0/1
      verbatim: 1                       # 0/1
      other: |-
        (?x)
            \\\]
            |
            \\item(?:\h|\[)
            |
            \\begin\{paragraph\} # <--- new bit
            |                # <--- new bit
            \\end\{paragraph\}   # <--- new bit
    blocksBeginWith:
      A-Z: 1                            # 0/1
      a-z: 1                            # 0/1
      0-9: 0                            # 0/1
      other: 0                          # regex
    blocksEndBefore:
      commentOnOwnLine: 1               # 0/1
      verbatim: 1                       # 0/1
      other: \\begin\{|\\\[|\\end\{     # regex
    huge: overflow                      # forbid mid-word line breaks
    separator: ""
